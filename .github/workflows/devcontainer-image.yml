# Purpose: Build and publish the multi-arch contributor devcontainer image.
# Source of truth: .devcontainer/Dockerfile + tool-versions.env
# Triggers: path-filtered to .devcontainer/** (not on every development push).
# Safety: no secrets in the image; GITHUB_TOKEN writes GHCR only on push (not PRs).

name: Devcontainer image

on:
  push:
    branches: [development, main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  pull_request:
    branches: [main, master, development, dev]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >>"${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build (and push digest on branch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=devcontainer-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.platform }}
          outputs: >-
            ${{
              github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name)
            }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=short

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${image}@sha256:%s " *)
