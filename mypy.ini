# Mypy configuration for every tracked Python file (lints/run_mypy.sh).
#
# Strong-types policy: annotations are mandatory and `Any` is treated as a defect,
# not an escape hatch. See docs/strong-types.md. Where a module genuinely has to
# handle shapeless JSON, the exemption is recorded per-module below with its reason
# rather than being left to an inline `# type: ignore`.
[mypy]
python_version = 3.11
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Beyond `strict`: reject the broad types that silently disable checking.
# `disallow_any_explicit` is not part of `strict`; it is what makes "no Any" an
# enforced rule rather than a review convention.
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true

# Dead code and comparisons that can never hold are defects, not slack.
warn_unreachable = true
strict_equality = true
extra_checks = true

# A suppression must name what it suppresses, and must not be stale.
enable_error_code = ignore-without-code, redundant-cast, unused-ignore

# Third-party packages without shipped type information.
[mypy-httpx.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-server]
disallow_untyped_decorators = False

# No per-module `disallow_any_explicit = False` exemptions exist. Every explicit
# `Any` in the tree was replaced with a TypedDict, a union, or `object` narrowed by
# isinstance. Adding an exemption here needs a written reason and a reviewer.
