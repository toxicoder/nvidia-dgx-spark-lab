# Purpose: Mode A rounded stack with Qwen3.6 27B quality on spark2
# Source of truth: k8s/overlays/rounded-stack-quality/
# Regenerate: n/a
# Safety: lab-med falls back to lab-smart; not MedGemma

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../workloads/qwen3.6-35b-a3b-nvfp4
  - ../../workloads/qwen3.8-flash-next-nvfp4
  - ../../workloads/qwen3.6-27b-nvfp4
  - ../../workloads/litellm

patches:
  - path: patches/pin-spark0.yaml
    target:
      kind: Job
      name: qwen3.6-35b-a3b-nvfp4
  - path: patches/pin-spark2.yaml
    target:
      kind: Job
      name: qwen3.6-27b-nvfp4
