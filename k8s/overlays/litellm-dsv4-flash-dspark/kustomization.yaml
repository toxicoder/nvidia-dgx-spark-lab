# Purpose: LiteLLM ConfigMap overlay for exclusive DeepSeek-V4-Flash DSpark TP=2
# Source of truth: k8s/overlays/litellm-dsv4-flash-dspark/
# Regenerate: n/a
# Safety: replaces router config only; no GPU; LAN ClusterIP
# apply: kubectl apply -k --load-restrictor=LoadRestrictionsNone (profiles live under workloads/litellm/files)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-inference

resources:
  - ../../workloads/litellm

configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml=../../workloads/litellm/files/profiles/deepseek-v4-flash-dspark.yaml
      - lab-med-system.txt=../../workloads/litellm/files/lab-med-system.txt
      - lab-med-frontier-fallback.txt=../../workloads/litellm/files/lab-med-frontier-fallback.txt
    options:
      labels:
        app: litellm
        workload: management
        lab.litellm-backend: dsv4-flash-dspark
      disableNameSuffixHash: true

labels:
  - pairs:
      lab.litellm-backend: dsv4-flash-dspark
    includeSelectors: false
    includeTemplates: true
