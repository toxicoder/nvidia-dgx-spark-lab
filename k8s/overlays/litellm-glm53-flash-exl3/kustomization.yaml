# Purpose: LiteLLM ConfigMap overlay for exclusive GLM-5.3-Flash EXL3 TensorFold TP=2
# Source of truth: k8s/overlays/litellm-glm53-flash-exl3/
# Regenerate: n/a
# Safety: replaces router config only; no GPU; LAN ClusterIP
# apply: kubectl apply -k --load-restrictor=LoadRestrictionsNone (profiles live under workloads/litellm/files)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-inference

resources:
  - ../../workloads/litellm

configMapGenerator:
  - name: litellm-config
    behavior: replace
    files:
      - config.yaml=../../workloads/litellm/files/profiles/glm-5.3-flash-exl3-tensorfold.yaml
      - lab-med-system.txt=../../workloads/litellm/files/lab-med-system.txt
      - lab-med-frontier-fallback.txt=../../workloads/litellm/files/lab-med-frontier-fallback.txt
    options:
      labels:
        app: litellm
        workload: management
        lab.litellm-backend: glm53-flash-exl3
      disableNameSuffixHash: true

labels:
  - pairs:
      lab.litellm-backend: glm53-flash-exl3
    includeSelectors: false
    includeTemplates: true
