# Purpose: Mode A rounded stack (spark0 35B + spark1 Flash-Next + spark2 MedGemma + LiteLLM)
# Source of truth: k8s/overlays/rounded-stack/
# Regenerate: n/a
# Safety: manual start via start-stack-rounded; exclusive with Mode B

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../workloads/qwen3.6-35b-a3b-nvfp4
  - ../../workloads/qwen3.8-flash-next-nvfp4
  - ../../workloads/medgemma-27b
  - ../../workloads/litellm

patches:
  - path: patches/pin-spark0.yaml
    target:
      kind: Job
      name: qwen3.6-35b-a3b-nvfp4
