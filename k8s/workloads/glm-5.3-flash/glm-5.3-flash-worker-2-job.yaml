# Purpose: GLM-5.3-Flash NVFP4 TP=3 worker rank 2 on spark2 (Mode B, QSFP ring)
# Source of truth: k8s/workloads/glm-5.3-flash/
# Regenerate: n/a
# Safety: exclusive frontier; hostNetwork + ring NCCL; gpu-mem-util 0.82; no 2-node 400G vars

apiVersion: batch/v1
kind: Job
metadata:
  name: glm-5.3-flash-worker-2
  namespace: ai-inference
  labels:
    app: glm-5.3-flash-worker-2
    workload: inference
    mode: production
    family: glm-5.3
    role: worker
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: glm-5.3-flash-worker-2
        workload: inference
        mode: production
        family: glm-5.3
        role: worker
    spec:
      restartPolicy: OnFailure
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: spark2
      containers:
        - name: inference
          image: glm53-flash-tp3:local
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: "8"
              memory: "95Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "110Gi"
              nvidia.com/gpu: "1"
          env:
            - name: NCCL_SOCKET_IFNAME
              value: "enP7s7"
            - name: UCX_NET_DEVICES
              value: "enP7s7"
            - name: OMPI_MCA_btl_tcp_if_include
              value: "enP7s7"
            - name: GLOO_SOCKET_IFNAME
              value: "enP7s7"
            - name: NCCL_IB_HCA
              value: "rocep1s0f0,roceP2p1s0f0,rocep1s0f1,roceP2p1s0f1"
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_IB_MERGE_NICS
              value: "0"
            - name: NCCL_NET_PLUGIN
              value: "none"
            - name: NCCL_IB_SUBNET_AWARE_ROUTING
              value: "1"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: CUTE_DSL_ARCH
              value: "sm_121a"
            - name: TORCH_CUDA_ARCH_LIST
              value: "12.1a"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: MODEL_NAME
              value: "local-inference-lab/GLM-5.3-Flash-NVFP4"
            - name: HF_HOME
              value: "/models"
            - name: NODE_RANK
              value: "2"
            - name: MASTER_ADDR
              value: "spark0"
            - name: MASTER_PORT
              value: "29521"
            - name: VLLM_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command: ["/bin/sh", "-c"]
          args:
            - >
              exec vllm serve "${MODEL_NAME}"
              --host 0.0.0.0
              --port 8000
              --served-model-name glm-5.3-flash
              --trust-remote-code
              --tensor-parallel-size 3
              --pipeline-parallel-size 1
              --nnodes 3
              --node-rank "${NODE_RANK}"
              --master-addr "${MASTER_ADDR}"
              --master-port "${MASTER_PORT}"
              --distributed-executor-backend mp
              --enable-expert-parallel
              --disable-custom-all-reduce
              --headless
              --quantization modelopt_mixed
              --kv-cache-dtype fp8
              --moe-backend marlin
              --gpu-memory-utilization 0.82
              --max-model-len 131072
              --max-num-seqs 4
              --max-num-batched-tokens 2048
              --enable-chunked-prefill
              --enable-prefix-caching
              --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
              --hf-overrides '{"num_attention_heads":66,"num_key_value_heads":66,"linear_num_heads":66,"text_config":{"num_attention_heads":66,"num_key_value_heads":66,"linear_num_heads":66}}'
              --tool-call-parser glm47
              --enable-auto-tool-choice
              --reasoning-parser glm45
              --limit-mm-per-prompt '{"image":4,"video":1}'
          volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          hostPath:
            path: /mnt/models
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
