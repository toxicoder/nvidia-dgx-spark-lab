# Purpose: LiteLLM router profile for exclusive DeepSeek-V4-Flash DSpark TP=2
# Source of truth: k8s/workloads/litellm/files/profiles/deepseek-v4-flash-dspark.yaml
# Regenerate: n/a
# Safety: single backend; proxy stays up if the Job 503s; no cloud routes

model_list:
  - model_name: lab-auto
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: http://deepseek-v4-flash-dspark.ai-inference.svc.cluster.local:8000/v1
      api_key: os.environ/LITELLM_DUMMY_KEY
      timeout: 600
  - model_name: lab-frontier
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: http://deepseek-v4-flash-dspark.ai-inference.svc.cluster.local:8000/v1
      api_key: os.environ/LITELLM_DUMMY_KEY
      timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
