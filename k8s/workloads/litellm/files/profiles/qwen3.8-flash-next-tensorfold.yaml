# Purpose: LiteLLM router profile for the single-Spark TensorFold Qwen3.8 Flash Next lane
# Source of truth: k8s/workloads/litellm/files/profiles/qwen3.8-flash-next-tensorfold.yaml
# Regenerate: n/a
# Safety: exclusive single-Spark lane, manual start, heavy confirm, one lane at a time

model_list:
  - model_name: lab-auto
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: http://qwen3.8-flash-next-tensorfold.ai-inference.svc.cluster.local:8000/v1
      api_key: os.environ/LITELLM_DUMMY_KEY
      timeout: 600
  - model_name: lab-quality
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: http://qwen3.8-flash-next-tensorfold.ai-inference.svc.cluster.local:8000/v1
      api_key: os.environ/LITELLM_DUMMY_KEY
      timeout: 600
  - model_name: lab-qwen38-flash-next-tensorfold
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: http://qwen3.8-flash-next-tensorfold.ai-inference.svc.cluster.local:8000/v1
      api_key: os.environ/LITELLM_DUMMY_KEY
      timeout: 600

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
