# Safety: exclusive with Mode A; pair NCCL on these Jobs only; manual start via manage.sh

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deepseek-v4-flash-dspark-job.yaml
  - deepseek-v4-flash-dspark-worker-1-job.yaml
  - service.yaml
