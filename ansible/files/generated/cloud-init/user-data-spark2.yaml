# Purpose: generated cloud-init user-data for spark2 (fabric: switch) — first-boot OS/netplan prep
# Source of truth: ansible/inventory/lab.yaml
# Regenerate: ./scripts/manage.sh setup or scripts/lib/topology.sh topology_render
# Safety: OS/netplan/SSH prep only; K3s is installed later by Ansible; applying this reboots the node

#cloud-config
hostname: spark2

package_update: true
packages:
  - curl
  - wget
  - ca-certificates
  - gnupg
  - lsb-release
  - jq
  - nfs-common
  - open-iscsi
  - rdma-core
  - ibverbs-utils
  - python3-pip

swap:
  filename: /swapfile
  size: 0

write_files:
  - path: /etc/netplan/99-highspeed.yaml
    permissions: "0644"
    content: |

      version: 2
      ethernets:
        enp1s0f0np0:
          dhcp4: false
          mtu: 9000
          addresses:
            - 192.168.112.1/24

runcmd:
  - swapoff -a || true
  - sed -i '/ swap / s/^/#/' /etc/fstab || true
  - modprobe overlay || true
  - modprobe br_netfilter || true
  - modprobe ib_uverbs || true
  - sysctl -w net.bridge.bridge-nf-call-iptables=1 || true
  - sysctl -w net.bridge.bridge-nf-call-ip6tables=1 || true
  - sysctl -w net.ipv4.ip_forward=1 || true
  - netplan apply || true
  - |
    if [ ! -f /home/ubuntu/.ssh/id_ed25519 ]; then
      sudo -u ubuntu ssh-keygen -t ed25519 -f /home/ubuntu/.ssh/id_ed25519 -N "" -q
    fi
  - echo "spark2 (switch) cloud-init prep done. Next: ansible bootstrap from the operator client."

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
