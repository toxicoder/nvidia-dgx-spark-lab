# Purpose: Apply Kubernetes node labels for scheduling
# Source of truth: this file
# Regenerate: n/a
# Safety: changes node affinity for workloads

---
- name: Label control-plane node
  vars:
    cp_node: "{{ groups['k3s_server'][0] | default(k3s_control_plane) }}"
  shell: |
    kubectl label node {{ cp_node }} node-role.kubernetes.io/control-plane= --overwrite || true
    kubectl label node {{ cp_node }} node-role.kubernetes.io/worker= --overwrite || true
    kubectl label node {{ cp_node }} nvidia-dgx-spark/role=control-plane-worker --overwrite || true

- name: Label worker nodes (if any)
  shell: |
    kubectl label node {{ item }} node-role.kubernetes.io/worker= --overwrite || true
    kubectl label node {{ item }} nvidia-dgx-spark/role=worker --overwrite || true
  loop: "{{ groups['k3s_agent'] | default([]) }}"

- name: Add high-speed interconnect label (multi-node only)
  shell: |
    kubectl label node {{ item }} nvidia-dgx-spark/highspeed=true --overwrite || true
  loop: "{{ groups['k3s_cluster'] | default([]) }}"
  when: groups['k3s_cluster'] | default([]) | length > 1
